<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Евгений Вахнин — дизайнер интерфейсов</title>
<meta name="description" content="Дизайнер из Санкт-Петербурга. Проектирую интерфейсы для веба и мобильных приложений.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg:#fff; --text:#000; --link:#0a84ff; --pad:40px; --gap:20px;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:1360px;margin:0 auto;padding:var(--pad)}

/* Шапка */
.head{
  display:grid; grid-template-columns:repeat(12,1fr);
  column-gap:var(--gap); row-gap:24px;
  margin-bottom:40px; align-items:start;
}
.name{
  grid-column:1/6;
  font-weight:500; font-size:clamp(56px,6.2vw,84px);
  line-height:1.1; letter-spacing:-.025em;
}
.role{grid-column:6/9; padding-top:4px}
.about{grid-column:9/13; padding-top:4px}
.about p{margin-bottom:16px}
.links{display:flex; gap:16px; flex-wrap:wrap}
.about a{display:block}
a{color:var(--link); text-decoration:none}
a:hover{text-decoration:underline; text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--link); outline-offset:3px; border-radius:2px}
.email{display:block; margin-bottom:0}

/* Обложки кейсов */
.cases{display:grid; gap:var(--gap)}
.case{display:block; overflow:hidden; background:#eee; position:relative}
.case img{
  display:block; width:100%; height:auto;
  transform:scale(1.08) translateY(var(--shift,0px));
  will-change:transform;
}
.case:hover{text-decoration:none}

/* Единственный анимированный момент: обложки открываются при загрузке */
@media (prefers-reduced-motion:no-preference){
  .case{clip-path:inset(0 0 100% 0); animation:open 1.1s cubic-bezier(.7,0,.2,1) forwards}
  .case:nth-child(2){animation-delay:.18s}
  @keyframes open{to{clip-path:inset(0 0 0 0)}}
  .case img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .case:hover img{transform:scale(1.11) translateY(var(--shift,0px))}
}

/* Планшет и мобильные */
@media (max-width:900px){
  :root{--pad:24px}
  .name{grid-column:1/-1}
  .role,.about{grid-column:1/-1; padding-top:0}
}
@media (max-width:480px){
  :root{--pad:16px; --gap:12px}
  .page{padding-top:16px}
  .name{font-size:52px; letter-spacing:-.02em}
  .head{margin-bottom:32px; row-gap:16px}
  .case{aspect-ratio:3/2}
  .case img{height:100%; object-fit:cover}
}
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <h1 class="name">Евгений Вахнин</h1>
    <p class="role">Дизайнер<br>из Санкт-Петербурга</p>
    <div class="about">
      <p>3 года опыта. Проектирую интерфейсы для веба и мобильных приложений. Работал в E-com, B2E и B2C направлениях. Сейчас в «Наше Золото», ранее в «585 Золотой»</p>
      <a class="email" href="mailto:vaakhnin@gmail.com">vaakhnin@gmail.com</a>
      <div class="links">
        <a href="https://t.me/ВАШ_НИК">Telegram</a>
        <a href="resume.pdf">Резюме</a>
      </div>
    </div>
  </header>

  <section class="cases" aria-label="Проекты">
    <a class="case" href="#case-1">
      <img src="img/case-1.webp" width="1200" height="800" alt="Фасад Центра Помпиду с красным светодиодным экраном и огромными чёрными буквами">
    </a>
    <a class="case" href="#case-2">
      <img src="img/case-2.webp" width="1200" height="821" alt="Коллаж из постеров с абстрактными объектами в чёрно-белой, жёлтой и синей гамме" loading="lazy">
    </a>
  </section>
</main>

<script>
// Лёгкий параллакс внутри рамки при скролле
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cases=[].slice.call(document.querySelectorAll('.case'));
  var ticking=false;
  function update(){
    var vh=innerHeight;
    cases.forEach(function(c){
      var r=c.getBoundingClientRect();
      var p=(r.top+r.height/2-vh/2)/vh;      // -1..1
      var max=r.height*0.035;
      c.style.setProperty('--shift',(-p*max).toFixed(1)+'px');
    });
    ticking=false;
  }
  addEventListener('scroll',function(){ if(!ticking){ticking=true;requestAnimationFrame(update);} },{passive:true});
  addEventListener('resize',update);
  update();
})();
</script>
</body>
</html>
